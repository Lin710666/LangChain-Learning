[project]
name = "longchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "'Lin710666'", email = "'linxinze935@gmail.com'" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "jsonpointer>=3.1.1",
    "jupyter>=1.1.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langserve>=0.3.3",
    "notebook>=7.6.2",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.53.0",
]

[project.scripts]
longchain = "longchain:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
